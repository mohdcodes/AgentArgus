name: Bug report
description: Report a problem with AgentArgus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug! Please give us enough to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect vs. what actually occurred?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      description: Paste the full error output (redact any secrets).
      render: shell
  - type: input
    id: version
    attributes:
      label: AgentArgus version
      description: "python -c \"import agentargus; print(agentargus.__version__)\""
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version & OS
      placeholder: "Python 3.11 on Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: My snippet contains no API keys or secrets.
          required: true
