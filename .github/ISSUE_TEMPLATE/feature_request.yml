name: Feature request
description: Suggest an idea or improvement for AgentArgus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point motivating the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like AgentArgus to do. API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents / wrapping
        - Observability / tracing
        - Cost tracking
        - Reliability
        - Evaluation / metrics
        - Orchestration
        - Human-in-the-loop
        - Docs / examples
        - Other
    validations:
      required: true
